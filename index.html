<script>
const T=THREE,$=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);

const gm=new T.ShaderMaterial({uniforms:{t:{value:0},q:{value:0},tr:{value:1},fogc:{value:new T.Color(0x200040)}},
vertexShader:`varying vec3 p;uniform float t,q,tr;void main(){vec3 w=(modelMatrix*vec4(position,1.)).xyz;float k=smoothstep(12.,50.,length(w.xz-cameraPosition.xz));w.y+=sin(w.x*.07+t*.8)*cos(w.z*.06-t*.6)*1.4*k*(.5+tr*.5+q*1.5);p=w;gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}`,

float f=clamp((length(p-cameraPosition)-15.)/105.,0.,1.);c=mix(c,fogc,f);gl_FragColor=vec4(c,1.);}`});
const ground=new T.Mesh(new T.PlaneGeometry(500,500,150,150),gm);ground.rotation.x=-Math.PI/2;ground.frustumCulled=false;sc.add(ground);
const bhopMap=new T.Group(),bhopPads=[];{const mat=new T.MeshStandardMaterial({color:0x272044,metalness:.35,roughness:.48,emissive:0x29144a,emissiveIntensity:.6});const glow=new T.MeshBasicMaterial({color:0x46eaff});
 const pad=(x,y,z,sx,sz,i)=>{const m=new T.Mesh(new T.BoxGeometry(sx,.55,sz),i%2?mat:glow);m.position.set(x,y,z);bhopMap.add(m);bhopPads.push({x,y:y+.275,z,sx,sz})};
 pad(0,0,0,12,12,0);for(let i=1;i<=14;i++){const z=-i*11,x=Math.sin(i*1.4)*7,y=1.2+Math.sin(i*.8)*1.4;pad(x,y,z,5.2,5.2,i);const ring=new T.Mesh(new T.TorusGeometry(1.3,.09,8,24),glow);ring.position.set(x,y+.45,z);bhopMap.add(ring)}
 pad(0,0,-165,18,18,1);sc.add(bhopMap);bhopMap.visible=false}
const skm=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:0},q:{value:0},tr:{value:1}},
vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:HSV+`varying vec3 d;uniform float t,q,tr;
void main(){float s=sin(d.x*5.+t*.6+sin(d.z*4.-t*.5)*2.)+sin(d.z*6.-t*.4+sin(d.y*5.+t)*2.)+sin((d.x+d.y+d.z)*7.+t*.8);
float h=fract(t*.03+s*.07*tr+d.y*.35);float v=.3+.22*sin(s*1.7+t)*tr+max(d.y,0.)*.2;
vec3 c=hsv(h,.75+.2*q,v);float st=step(.996,fract(sin(dot(floor(d*60.),vec3(12.9,78.2,37.7)))*43758.5));c+=st*.8;gl_FragColor=vec4(c,1.);}`});
const sky=new T.Mesh(new T.SphereGeometry(300,32,16),skm);sky.renderOrder=-1;sky.frustumCulled=false;sc.add(sky);
const NP=700,pp=new Float32Array(NP*3),pc=new Float32Array(NP*3);for(let i=0;i<NP;i++){pp[i*3]=rnd(-60,60);pp[i*3+1]=rnd(.5,25);pp[i*3+2]=rnd(-60,60);const c=hc(Math.random());pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b}
const sprc=document.createElement('canvas');sprc.width=sprc.height=32;{const g=sprc.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'#fff');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32)}
const pgeo=new T.BufferGeometry();pgeo.setAttribute('position',new T.BufferAttribute(pp,3));pgeo.setAttribute('color',new T.BufferAttribute(pc,3));
const spores=new T.Points(pgeo,new T.PointsMaterial({size:.8,map:new T.CanvasTexture(sprc),vertexColors:true,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));spores.frustumCulled=false;sc.add(spores);
// rainbow arcs
const rg=new T.Group();for(let i=0;i<5;i++){const r=new T.Mesh(new T.TorusGeometry(70+i*7,2.4,8,64,Math.PI),new T.MeshBasicMaterial({color:hc(i/5),fog:false}));r.position.set(0,-4,-150);rg.add(r)}sc.add(rg);
// forest
const deco=[],mats=[];
for(let i=0;i<110;i++){const g=new T.Group(),h=Math.random(),r=rnd(10,95),a=rnd(0,6.283),k=i%3;
 const M=(c,e)=>{const m=new T.MeshLambertMaterial({color:c,emissive:c.clone().multiplyScalar(e||.2),flatShading:true}),o={};c.getHSL(o);mats.push({m,h:o.h,s:o.s,l:o.l,e:e||.2});return m};
 if(k==0){const H=rnd(5,10);const tr=new T.Mesh(new T.CylinderGeometry(.3,.55,H,6),M(hc(h+.1).multiplyScalar(.5),0));tr.position.y=H/2;g.add(tr);
  for(let j=0;j<3;j++){const c=new T.Mesh(new T.ConeGeometry(3-j*.8,3.5,7),M(hc(h+.15*j+.3),.3));c.position.y=H*.6+j*2.2;g.add(c)}}
 else if(k==1){const H=rnd(2,5);const s=new T.Mesh(new T.CylinderGeometry(.35,.5,H,7),M(new T.Color(0xf4e8ff),.2));s.position.y=H/2;g.add(s);
  const cp=new T.Mesh(new T.SphereGeometry(H*.8,12,8,0,6.283,0,1.57),M(hc(h),.35));cp.position.y=H;g.add(cp)}
 else{const H=rnd(3,8);const cr=new T.Mesh(new T.OctahedronGeometry(1,0),M(hc(h+.5),.6));cr.scale.set(1,H/1.5,1);cr.position.y=H/1.5;g.add(cr)}
 g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={p:rnd(0,6),k};deco.push(g);sc.add(g)}
// Stylized first-person weapon, rebuilt from clean geometric parts for each menu selection.
const gun=new T.Group();gun.position.set(.26,-.24,-.55);cam.add(gun);let weaponMotion=0;
function buildWeapon(){while(gun.children.length){const o=gun.children.pop();o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()}
 const w=WPN[weaponIndex],metal=new T.MeshStandardMaterial({color:0x242238,metalness:.82,roughness:.26}),accent=new T.MeshStandardMaterial({color:w.color,emissive:w.color,emissiveIntensity:.55,metalness:.45,roughness:.25}),grip=new T.MeshStandardMaterial({color:0x15131f,roughness:.8});
 const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);gun.add(m);return m};
 if(w.kind==='sniper'){add(new T.BoxGeometry(.14,.17,.6),metal,0,0,0);add(new T.BoxGeometry(.11,.12,.34),grip,0,-.13,.12);add(new T.CylinderGeometry(.032,.04,.85,10),metal,0,0,-.65,Math.PI/2);add(new T.CylinderGeometry(.075,.075,.31,12),accent,0,.14,-.15,Math.PI/2);add(new T.CylinderGeometry(.11,.11,.09,12),metal,0,.14,-.15,Math.PI/2);add(new T.BoxGeometry(.22,.035,.12),accent,0,.1,-.15)}
 else if(w.kind==='deagle'){add(new T.BoxGeometry(.14,.19,.36),metal,0,.01,-.06);add(new T.BoxGeometry(.12,.2,.18),accent,0,.12,-.11);add(new T.BoxGeometry(.12,.28,.16),grip,0,-.17,.04,.25);add(new T.CylinderGeometry(.035,.035,.43,10),metal,0,.075,-.36,Math.PI/2);add(new T.BoxGeometry(.2,.04,.08),accent,0,.18,-.08)}
 else {add(new T.BoxGeometry(.1,.23,.11),grip,0,-.11,.02,.22);add(new T.TorusGeometry(.09,.018,6,16),accent,0,-.21,.06,Math.PI/2);const blade=add(w.name==='Бабочка'?new T.BufferGeometry():new T.ConeGeometry(.105,.55,4),accent,0,.11,-.27,Math.PI/2);if(w.name==='Бабочка'){const shape=new T.Shape();shape.moveTo(-.08,-.27);shape.lineTo(.1,-.15);shape.lineTo(.06,.22);shape.lineTo(0,.34);shape.lineTo(-.06,.22);shape.closePath();blade.geometry=new T.ShapeGeometry(shape);blade.rotation.set(0,0,0);blade.position.set(0,.02,-.24);blade.scale.set(.55,.9,.12);add(new T.BoxGeometry(.055,.16,.06),metal,0,.05,.01,.35)}}
}
buildWeapon();
// enemy parts
const eG=new T.IcosahedronGeometry(1,1),sG=new T.ConeGeometry(.16,.7,5),eyeG=new T.SphereGeometry(.2,8,8),pupG=new T.SphereGeometry(.09,6,6);
function mkEnemy(){const h=Math.random(),col=hc(h),g=new T.Group();
 const body=new T.Mesh(eG,new T.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:.55,flatShading:true,roughness:.4}));g.add(body);
 const sm=new T.MeshLambertMaterial({color:hc(h+.5),emissive:hc(h+.5).multiplyScalar(.4)});
 for(let i=0;i<10;i++){const d=new T.Vector3(rnd(-1,1),rnd(-1,.6),rnd(-1,.3)).normalize();const s=new T.Mesh(sG,sm);s.position.copy(d).multiplyScalar(1.05);s.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d);g.add(s)}
 for(const sx of[-1,1]){const e=new T.Mesh(eyeG,new T.MeshBasicMaterial({color:0xffffff}));e.position.set(sx*.38,.2,.88);g.add(e);const p=new T.Mesh(pupG,new T.MeshBasicMaterial({color:0}));p.position.set(sx*.38,.2,1.05);g.add(p)}
 g.userData={en:1,ph:rnd(0,6),sp:rnd(3.2,4.6),col};return g}
// state
const K={};addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space')e.preventDefault();if(e.repeat)return;if(e.code==='Digit1'){weaponIndex=0;buildWeapon()}if(e.code==='Digit2'){weaponIndex=1;buildWeapon()}if(e.code==='Digit3'){weaponIndex=2;buildWeapon()}});addEventListener('keyup',e=>K[e.code]=0);
let S,A=null,alive=false,locked=false,yaw=0,pitch=0,fire=false,kick=0,hs=0;
const pos=new T.Vector3(),vel=new T.Vector3(),parts=[],rc=new T.Raycaster();
const pg=new T.SphereGeometry(.12,5,4);
const tl=new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3()]),new T.LineBasicMaterial({color:0xffffff}));tl.frustumCulled=false;tl.visible=false;sc.add(tl);let tlT=0;
const stump=new T.Group();{const m=new T.MeshLambertMaterial({color:0x6b4423});const b=new T.Mesh(new T.CylinderGeometry(1.1,1.4,1.3,10),m);b.position.y=.65;stump.add(b);
 const tp=new T.Mesh(new T.CylinderGeometry(1.05,1.05,.1,10),new T.MeshLambertMaterial({color:0xc9a06b}));tp.position.y=1.32;stump.add(tp);
 const ring=new T.Mesh(new T.TorusGeometry(2.2,.08,8,40),new T.MeshBasicMaterial({color:0xffffff}));ring.rotation.x=Math.PI/2;ring.position.y=.4;ring.name='ring';stump.add(ring);
 const beam=new T.Mesh(new T.CylinderGeometry(.5,1.4,60,12,1,true),new T.MeshBasicMaterial({color:0xaaffee,transparent:true,opacity:.28,side:T.DoubleSide,fog:false,depthWrite:false}));beam.position.y=30;stump.add(beam);
 const sl2=new T.PointLight(0xaaffee,2,18);sl2.position.set(0,3,0);stump.add(sl2)}
function audio(){if(A)return;try{A=new (window.AudioContext||window.webkitAudioContext)();MG=A.createGain();MG.gain.value=ST.vol;MG.connect(A.destination);MB=A.createGain();MB.gain.value=ST.mus;MB.connect(MG);const d=A.createDelay(1);d.delayTime.value=.34;const fb=A.createGain();fb.gain.value=.55;MB.connect(d);d.connect(fb);fb.connect(d);d.connect(MG)}catch(e){A=null}}
function snd(f,d,t,v){if(!A)return;const o=A.createOscillator(),g=A.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.07,A.currentTime);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(MG);o.start();o.stop(A.currentTime+d)}
function mus(f,d,v,ty){if(!A)return;const o=A.createOscillator(),g=A.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,A.currentTime);g.gain.linearRampToValueAtTime(v,A.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.connect(g);g.connect(MB);o.start();o.stop(A.currentTime+d)}
const PEN=[0,2,4,7,9,12,14,16,19,21];let ni=3;
setInterval(()=>{if(!(S&&alive&&locked&&A))return;const q=1-Math.max(0,S.f)/100;ni=(ni+(Math.random()<.5?1:-1)+PEN.length)%PEN.length;let f=220*Math.pow(2,PEN[ni]/12);if(Math.random()<q*.5)f*=Math.pow(2,1/12);mus(f,1.8,.09,q>.6?'sawtooth':'sine');if(Math.random()<.15)mus(f/2,3.5,.12)},260);

function reset(){if(S)S.en.forEach(e=>sc.remove(e));sc.remove(stump);S={f:100,t:0,k:0,en:[],cl:false,hold:0,boost:0,shake:0,sp:2,nc:10,tick:0,flash:0,cd:0,mt:0,life:0,msg:'',checkpoint:0};bhopMap.visible=gameMode==='bhop';ground.visible=gameMode!=='bhop';deco.forEach(o=>o.visible=gameMode!=='bhop');pos.set(0,0,0);vel.set(0,0,0);yaw=0;pitch=0;alive=true;$('msg').textContent='';if(gameMode==='bhop')say('Bhop park — держи пробел, стрейфуй A/D!')}
function menu(t,txt,btn,fn){$('box').innerHTML=`<h1>${t}</h1>${txt}<div class="label">Режим игры</div><div class="choice"><button id="m_trip" class="${gameMode==='trip'?'active':''}">Радужный лес</button><button id="m_bhop" class="${gameMode==='bhop'?'active':''}">Bhop-парк</button></div><div class="label">Оружие · слот 3 — ножи</div><div class="choice">${WPN.map((w,i)=>`<button data-w="${i}" class="${weaponIndex===i?'active':''}">${i===0?'1 · ':i===1?'2 · ':'3 · '}${w.name}</button>`).join('')}</div><div id="set">${SD.map(([k,n,a,b,st])=>`<div class="row"><span>${n}</span><input type="range" id="s_${k}" min="${a}" max="${b}" step="${st}" value="${ST[k]}"></div>`).join('')}</div><button id="go">${btn}</button>`;$('ov').style.display='flex';$('go').onclick=fn;
 $('m_trip').onclick=()=>{gameMode='trip';menu(t,txt,btn,fn)};$('m_bhop').onclick=()=>{gameMode='bhop';menu(t,txt,btn,fn)};document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{weaponIndex=+e.dataset.w;buildWeapon();menu(t,txt,btn,fn)});
 SD.forEach(([k])=>{const e=$('s_'+k);e.oninput=()=>{ST[k]=+e.value;save();if(MG)MG.gain.value=ST.vol;if(MB)MB.gain.value=ST.mus}})}
function lock(){audio();ren.domElement.requestPointerLock()}
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===ren.domElement;if(locked)$('ov').style.display='none';else if(alive)menu('Пауза','<p>Клик по кнопке вернёт тебя в лес.</p>','Продолжить',lock)});
document.addEventListener('pointerlockerror',()=>{$('box').insertAdjacentHTML('beforeend','<p>Браузер не дал захватить мышь. Открой игру по ссылке в отдельной вкладке.</p>')});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022*ST.sens;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0022*ST.sens))});
addEventListener('mousedown',e=>{if(locked&&e.button==0)fire=true});addEventListener('mouseup',()=>fire=false);
menu('Бнихоп-Снайпер',`<p>Радужный лес, причудливые видения и психоделическая дымка. Развеивай существ, чтобы удержать фокус.</p>
<p><b>WASD</b> — движение, <b>мышь</b> — взгляд, <b>ЛКМ</b> — атака, <b>Пробел</b> — банни-хоп. Воздушный стрейф с A/D помогает разогнаться. В Bhop-парке пройди платформенную трассу на время.</p>
<p>Увидишь светящийся луч, там <b>Объект Ясности</b>. Подбеги и зажми <b>E</b>, выдержи панику, и Фокус вернётся.</p>`,'Войти',()=>{reset();lock()});
function burst(p,col){for(let i=0;i<16;i++){const m=new T.Mesh(pg,new T.MeshBasicMaterial({color:col}));m.position.copy(p);m.userData={v:new T.Vector3(rnd(-1,1),rnd(0,1.3),rnd(-1,1)).multiplyScalar(rnd(4,10)),l:.7};sc.add(m);parts.push(m)}}
function spread(){return .006+(1-S.f/100)*.2+(pos.y>0?.012:0)}
function shoot(){if(S.cd>0)return;const w=WPN[weaponIndex];S.cd=w.kind==='sniper'?.62:w.kind==='deagle'?.34:.42;kick=1;snd(w.kind==='sniper'?190:w.kind==='deagle'?310:520,.14,w.kind==='knife'?'triangle':'square',.06);if(w.kind==='knife')weaponMotion=1;
 const sp=w.kind==='sniper'?.0015:w.kind==='deagle'?.018:.006,reach=w.kind==='knife'?2.7:120;rc.setFromCamera(new T.Vector2(rnd(-1,1)*sp/cam.aspect,rnd(-1,1)*sp),cam);
 const hits=rc.intersectObjects(S.en,true).filter(h=>h.distance<=reach);let end=rc.ray.at(reach,new T.Vector3());
 if(hits.length){let o=hits[0].object;while(o&&!o.userData.en)o=o.parent;end=hits[0].point;
  if(o){const air=pos.y>0;burst(o.position,o.userData.col);sc.remove(o);S.en.splice(S.en.indexOf(o),1);S.k++;S.f=Math.min(100,S.f+(air?4.5:2));snd(880,.18,'triangle',.08);if(air)say('Воздушный выстрел!')}}
 const mz=gun.localToWorld(new T.Vector3(0,0,-.9)),pa=tl.geometry.attributes.position;pa.setXYZ(0,mz.x,mz.y,mz.z);pa.setXYZ(1,end.x,end.y,end.z);pa.needsUpdate=true;tl.visible=true;tlT=.06}
function accel(w,ws,ac,dt){const cur=vel.x*w.x+vel.z*w.z,add=ws-cur;if(add<=0)return;const a=Math.min(ac*ws*dt,add);vel.x+=w.x*a;vel.z+=w.z*a}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min((n-last)/1000,.05);last=n;if(S&&alive&&locked)upd(dt);if(S)fx(dt);ren.render(sc,cam)}
function upd(dt){S.t+=dt;S.cd-=dt;S.boost=Math.max(0,S.boost-dt);S.shake=Math.max(0,S.shake-dt*3);S.flash=Math.max(0,S.flash-dt*1.5);S.mt-=dt;if(S.mt<0)$('msg').textContent='';
 const fw=new T.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),rt=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const w=fw.multiplyScalar((K.KeyW?1:0)-(K.KeyS?1:0)).add(rt.multiplyScalar((K.KeyD?1:0)-(K.KeyA?1:0)));if(w.lengthSq()>0)w.normalize();
 const prevY=pos.y;let floor=0;for(const b of bhopPads)if(Math.abs(pos.x-b.x)<b.sx/2&&Math.abs(pos.z-b.z)<b.sz/2)floor=Math.max(floor,b.y);
 let on=gameMode==='bhop'?pos.y<=floor+.035&&vel.y<=0:pos.y<=.001&&vel.y<=0;if(on&&K.Space){vel.y=gameMode==='bhop'?9:8;on=false;snd(500,.08,'sine',.04)}
 if(on){const sp=Math.hypot(vel.x,vel.z),fr=K.Space?.45:5.5;if(sp>0){const ns=Math.max(sp-Math.max(sp,3)*fr*dt,0)/sp;vel.x*=ns;vel.z*=ns}accel(w,gameMode==='bhop'?12:8.5,gameMode==='bhop'?16:10,dt)}else{vel.y-=(gameMode==='bhop'?20:22)*dt;accel(w,gameMode==='bhop'?2.4:1.6,gameMode==='bhop'?100:70,dt)}
 if(gameMode==='bhop'&&w.lengthSq()===0){const sp=Math.hypot(vel.x,vel.z);if(sp>0.01){const side=new T.Vector3(-vel.z,0,vel.x).normalize().multiplyScalar((K.KeyA?1:0)-(K.KeyD?1:0));accel(side,sp+2,22,dt)}}
 pos.addScaledVector(vel,dt);if(pos.y<floor&&vel.y<0&&prevY>=floor-.08){pos.y=floor;vel.y=0}
 if(gameMode==='bhop'&&pos.y < -14){const cp=bhopPads[Math.max(0,S.checkpoint)];pos.set(cp.x,cp.y+1.2,cp.z);vel.set(0,0,0);say('Падение! Возврат на платформу')}
 if(gameMode==='bhop'){for(let i=0;i<bhopPads.length;i++){const b=bhopPads[i];if(Math.abs(pos.x-b.x)<b.sx/2&&Math.abs(pos.z-b.z)<b.sz/2&&pos.y>=b.y){S.checkpoint=Math.max(S.checkpoint,i);if(i===bhopPads.length-1){alive=false;document.exitPointerLock();menu('Трасса пройдена!',`<p>Финиш за <b>${S.t.toFixed(2)} с</b>. Скорость на финише: <b>${(hs*3.6).toFixed(0)} км/ч</b>.</p>`,'Заново',()=>{reset();lock()})}}}}
 const rr=Math.hypot(pos.x,pos.z);if(rr>85){pos.x*=85/rr;pos.z*=85/rr}
 hs=Math.hypot(vel.x,vel.z);
 if(fire)shoot();
 // enemies
 const hold=S.cl&&K.KeyE&&Math.hypot(pos.x-stump.position.x,pos.z-stump.position.z)<5;
 S.sp-=dt;if(gameMode==='trip'&&S.sp<=0&&S.en.length<24){S.sp=(1.9-Math.min(S.t/150,1))*(hold?.5:1)*rnd(.7,1.2);const e=mkEnemy(),a=rnd(0,6.283),r=rnd(28,42);e.position.set(pos.x+Math.cos(a)*r,1.5,pos.z+Math.sin(a)*r);e.userData.sp+=S.t*.012;sc.add(e);S.en.push(e)}
 const sl=S.boost>0?.45:1;
 for(let i=S.en.length-1;i>=0;i--){const e=S.en[i],d=new T.Vector3(pos.x-e.position.x,0,pos.z-e.position.z),L=d.length();d.normalize();
  e.position.addScaledVector(d,e.userData.sp*sl*dt);e.position.y=1.5+Math.sin(S.t*3+e.userData.ph)*.5;e.lookAt(cam.position);{const bm=e.children[0];bm.scale.setScalar(1+Math.sin(S.t*6+e.userData.ph)*.12*(1+(1-S.f/100)*2));bm.material.color.setHSL((S.t*.25+e.userData.ph/6.3)%1,.9,.55);bm.material.emissive.copy(bm.material.color)}
  if(L<1.8){burst(e.position,e.userData.col);sc.remove(e);S.en.splice(i,1);S.f-=12;S.shake=1;snd(80,.4,'sawtooth',.12)}}
 // clarity object
 if(gameMode==='trip'&&!S.cl){S.nc-=dt;if(S.nc<=0){const a=rnd(0,6.283),r=rnd(22,50);stump.position.set(pos.x+Math.cos(a)*r,0,pos.z+Math.sin(a)*r);sc.add(stump);S.cl=true;S.life=28;S.nc=rnd(14,22);say('Луч! Объект Ясности. Зажми E рядом')}}
 else{S.life-=dt;if(S.life<=0){S.cl=false;sc.remove(stump);S.hold=0;say('Якорь растворился...')}}
 if(S.cl){if(hold){S.hold+=dt/3.2;S.f-=3.5*dt;S.shake=Math.max(S.shake,.45);
   if(S.hold>=1){S.f=Math.min(100,S.f+45);S.boost=7;S.cl=false;sc.remove(stump);S.hold=0;S.flash=1;[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,1.3,'sine',.08),i*90));say('Прорыв. Фокус вернулся')}}
  else S.hold=Math.max(0,S.hold-dt*.6)}
 if(S.f<35){S.tick-=dt;if(S.tick<=0){S.tick=.7;snd(1200,.04,'square',.04)}}
 if(gameMode==='trip'&&S.f<=0){alive=false;document.exitPointerLock();menu('Фокус потерян',`<p>Ты продержался <b>${S.t.toFixed(0)} с</b> и развеял <b>${S.k}</b> галлюцинаций.</p>`,'Ещё раз',()=>{reset();lock()})}}
function fx(dt){const q=1-Math.max(0,S.f)/100,t=performance.now()/1000;
 gm.uniforms.t.value=t;gm.uniforms.q.value=q;
 sc.background.setHSL((t*.03+q*.2)%1,.65,.22+q*.06);sc.fog.color.copy(sc.background);
 const tp=ST.trip,ti=Math.min(1,.35*tp+q*1.2);gm.uniforms.tr.value=tp;gm.uniforms.fogc.value.copy(sc.background);skm.uniforms.t.value=t;skm.uniforms.q.value=q;skm.uniforms.tr.value=tp;
 sky.position.set(pos.x,pos.y+1.7,pos.z);spores.position.set(pos.x,Math.sin(t*.5)*1.5,pos.z);spores.rotation.y=t*.03;
 for(const o of mats){o.m.color.setHSL(((o.h+t*.04*tp+Math.sin(t+o.h*9)*.03*q)%1+1)%1,o.s,o.l);o.m.emissive.copy(o.m.color).multiplyScalar(o.e)}
 rg.rotation.y+=dt*.03;
 for(const g of deco){const p=g.userData.p;g.scale.y=1+Math.sin(t*1.5+p)*.05*(1+q*3);if(g.userData.k==2)g.rotation.y+=dt*.5;else g.rotation.z=Math.sin(t+p)*.03*(1+q*3)}
 const ring=stump.getObjectByName('ring');ring.rotation.z+=dt*2;ring.scale.setScalar(1+S.hold*.3);
 const bob=Math.sin(t*10)*.04*Math.min(hs/8,1)*(pos.y>0?0:1),sh=S.shake*.05+q*.02;
 cam.position.set(pos.x+rnd(-1,1)*sh,pos.y+1.7+bob+rnd(-1,1)*sh,pos.z);
 cam.rotation.set(pitch+rnd(-1,1)*q*.01,yaw,Math.sin(t*1.3)*q*.06+Math.sin(t*.7)*.015*ST.trip+rnd(-1,1)*S.shake*.03);
 cam.fov=ST.fov+Math.min(hs,25)*.5+Math.sin(t*2)*(q*7+tp*1.5);cam.updateProjectionMatrix();
 pl.position.set(pos.x,3,pos.z);pl.color.setHSL((t*.1)%1,1,.6);
 kick=Math.max(0,kick-dt*8);weaponMotion=Math.max(0,weaponMotion-dt*5);gun.position.z=-.55+kick*.1+weaponMotion*.15;gun.rotation.x=kick*.08-weaponMotion*.9;gun.rotation.y=Math.sin(weaponMotion*Math.PI)*.3;
 if(tlT>0){tlT-=dt;if(tlT<=0)tl.visible=false}
 for(let i=parts.length-1;i>=0;i--){const m=parts[i],u=m.userData;u.v.y-=15*dt;m.position.addScaledVector(u.v,dt);u.l-=dt;m.scale.setScalar(Math.max(u.l,.01));if(u.l<=0){sc.remove(m);m.material.dispose();parts.splice(i,1)}}
 const r=spread()*innerHeight/2,d=Math.max(16,r*2);$('ch').style.width=$('ch').style.height=d+'px';
 $('vig').style.opacity=.2+q*.75;
 ren.domElement.style.filter=tp>.02||q>.05?`url(#ca) saturate(${1+tp*.5+q*1.6}) hue-rotate(${Math.sin(t*.3)*35*tp+Math.sin(t*.8)*q*50}deg) contrast(${1+tp*.08}) blur(${(q*q*1.8).toFixed(2)}px)`:'none';
 $('ofr').setAttribute('dx',(Math.sin(t*1.7)*3*ti+q*4).toFixed(2));$('ofr').setAttribute('dy',(Math.cos(t*1.1)*2*ti).toFixed(2));$('ofb').setAttribute('dx',(-Math.sin(t*1.3)*3*ti-q*4).toFixed(2));
 ren.domElement.style.transform=`scale(${1.03+Math.sin(t*1.4)*.012*tp*(1+q*2)}) rotate(${Math.sin(t*.9)*.35*tp*(1+q*2)}deg)`;
 const ac=$('acid');ac.style.opacity=Math.min(.55,.14*tp+q*.35);ac.style.transform=`rotate(${t*8}deg)`;
 $('fl').style.opacity=S.flash*.8;
 $('fill').style.width=Math.max(0,S.f)+'%';$('fill').style.background=`hsl(${S.f*1.2},90%,55%)`;
 let extra='';if(S.cl)extra=`   |   Пень: ${Math.hypot(pos.x-stump.position.x,pos.z-stump.position.z).toFixed(0)} м`;if(S.boost>0)extra+=`   |   Ясность ${S.boost.toFixed(0)} с`;
 $('bar').style.display=gameMode==='bhop'?'none':'block';$('st').textContent=`${gameMode==='bhop'?`Bhop · чекпоинт ${S.checkpoint}/${bhopPads.length-1}`:`Фокус ${Math.max(0,S.f).toFixed(0)} · Убито ${S.k}`}  |  ${WPN[weaponIndex].name}  |  ${(hs*3.6).toFixed(0)} км/ч  |  ${S.t.toFixed(1)} с${extra}`;
 $('hb').style.display=S.hold>0?'block':'none';$('hf').style.width=S.hold*100+'%'}
requestAnimationFrame(loop);
</script></body></html>
