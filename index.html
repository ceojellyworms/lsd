<script>
const T=THREE,$=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a);
const ST=Object.assign({sens:1,vol:.7,mus:.6,fov:80,trip:1.5},(()=>{try{return JSON.parse(localStorage.getItem('bs3')||'{}')}catch(e){return{}}})());
try{if(localStorage.getItem('bs3_trip_default_v2')!=='1'){ST.trip=1.5;save();localStorage.setItem('bs3_trip_default_v2','1')}}catch(e){}
function save(){try{localStorage.setItem('bs3',JSON.stringify(ST))}catch(e){}}
const KNIVES=[{name:'Керамбит',color:0xff4fb8},{name:'Бабочка',color:0x9e7bff},{name:'M9 Bayonet',color:0x91ffd1}];
const WPN=[{name:'Снайперка',kind:'sniper',color:0x42e8ff},{name:'Дигл',kind:'deagle',color:0xffc45e}];
let gameMode='trip',weaponIndex=0,knifeIndex=0;
const SD=[['sens','Чувствительность мыши',.2,3,.05],['vol','Громкость',0,1,.02],['mus','Музыка',0,1,.02],['fov','Угол обзора (FOV)',60,110,1],['trip','Сила трипа',0,2,.05]];
let MG,MB;
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(80,1,.1,400);cam.rotation.order='YXZ';sc.add(cam);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
sc.background=new T.Color(0x200040);sc.fog=new T.Fog(0x200040,15,120);
sc.add(new T.HemisphereLight(0xffd0ff,0x2030a0,.95));
const sun=new T.DirectionalLight(0xffffff,.7);sun.position.set(30,60,20);sc.add(sun);
const pl=new T.PointLight(0xff40ff,1.3,45);sc.add(pl);
const hc=h=>new T.Color().setHSL(((h%1)+1)%1,.85,.55);
// ground shader
const HSV="vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}";
const gm=new T.ShaderMaterial({uniforms:{t:{value:0},q:{value:0},tr:{value:1},fogc:{value:new T.Color(0x200040)}},
vertexShader:`varying vec3 p;uniform float t,q,tr;void main(){vec3 w=(modelMatrix*vec4(position,1.)).xyz;float k=smoothstep(12.,50.,length(w.xz-cameraPosition.xz));w.y+=sin(w.x*.07+t*.8)*cos(w.z*.06-t*.6)*1.4*k*(.5+tr*.5+q*1.5);p=w;gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}`,
fragmentShader:HSV+`varying vec3 p;uniform float t,q,tr;uniform vec3 fogc;
void main(){float d=length(p.xz);float a=atan(p.z,p.x);
float w=sin(d*.35-t*2.5+sin(a*6.+t)*1.5)+sin(p.x*.25+t)*.5+sin(p.z*.31-t*1.3)*.5;
float h=fract(d*.01+a*.3183098+w*.08*(1.+q*2.)*tr-t*.06);
vec3 c=hsv(h,.85,.5+.25*sin(w*2.+t*3.)*tr);
vec2 g=abs(fract(p.xz*.5)-.5);float l=smoothstep(.44,.5,max(g.x,g.y));c+=l*hsv(fract(h+.5+sin(t)*.1),.7,.8);
float f=clamp((length(p-cameraPosition)-15.)/105.,0.,1.);c=mix(c,fogc,f);gl_FragColor=vec4(c,1.);}`});
const ground=new T.Mesh(new T.PlaneGeometry(500,500,150,150),gm);ground.rotation.x=-Math.PI/2;ground.frustumCulled=false;sc.add(ground);
const bhopMap=new T.Group(),bhopPads=[];let bhopNextId=0,bhopNextZ=0,bhopLastX=0,bhopLastY=0;
const bhopMat=new T.MeshStandardMaterial({color:0x272044,metalness:.35,roughness:.42,emissive:0x29144a,emissiveIntensity:.55});
const bhopGlow=new T.MeshStandardMaterial({color:0x182438,metalness:.58,roughness:.24,emissive:0x24dfff,emissiveIntensity:1.15});
function addBhopPad(x,y,z,sx,sz,id){const g=new T.Group(),base=new T.Mesh(new T.BoxGeometry(sx,.7,sz),id%4===0?bhopGlow:bhopMat);base.position.y=-.35;g.add(base);
 const top=new T.Mesh(new T.BoxGeometry(sx-.18,.055,sz-.18),new T.MeshBasicMaterial({color:id%2?0x7d55ff:0x42e8ff}));top.position.y=.025;g.add(top);
 for(const sxSign of[-1,1]){const strip=new T.Mesh(new T.BoxGeometry(.045,.018,sz-.5),new T.MeshBasicMaterial({color:0xffffff}));strip.position.set(sxSign*(sx/2-.18),.06,0);g.add(strip)}
 g.position.set(x,y,z);bhopMap.add(g);const pad={id,x,y:y+.055,z,sx,sz,mesh:g};bhopPads.push(pad);return pad}
function disposeBhopPad(p){bhopMap.remove(p.mesh);p.mesh.traverse(o=>{if(!o.isMesh)return;o.geometry.dispose();if(Array.isArray(o.material))o.material.forEach(m=>{if(m!==bhopMat&&m!==bhopGlow)m.dispose()});else if(o.material!==bhopMat&&o.material!==bhopGlow)o.material.dispose()})}
function streamBhop(){if(!S||S.mode!=='bhop')return;
 const ahead=110,behind=48;
 while(bhopNextZ>pos.z-ahead){const id=bhopNextId++,dz=rnd(8.5,12.5);bhopNextZ-=dz;bhopLastX=T.MathUtils.clamp(bhopLastX+rnd(-5.5,5.5),-10,10);bhopLastY=T.MathUtils.clamp(bhopLastY+rnd(-1.15,1.15),-.8,2.4);addBhopPad(bhopLastX,bhopLastY,bhopNextZ, id===0?12:rnd(4.8,6.1),id===0?12:rnd(4.8,6.1),id)}
 for(let i=bhopPads.length-1;i>=0;i--){const p=bhopPads[i];if(p.z>pos.z+behind){disposeBhopPad(p);bhopPads.splice(i,1)}}
}
addBhopPad(0,0,0,12,12,0);bhopNextId=1;bhopNextZ=-7;sc.add(bhopMap);bhopMap.visible=false;
const skm=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{t:{value:0},q:{value:0},tr:{value:1}},
vertexShader:`varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:HSV+`varying vec3 d;uniform float t,q,tr;
void main(){float s=sin(d.x*5.+t*.6+sin(d.z*4.-t*.5)*2.)+sin(d.z*6.-t*.4+sin(d.y*5.+t)*2.)+sin((d.x+d.y+d.z)*7.+t*.8);
float h=fract(t*.03+s*.07*tr+d.y*.35);float v=.3+.22*sin(s*1.7+t)*tr+max(d.y,0.)*.2;
vec3 c=hsv(h,.75+.2*q,v);float st=step(.996,fract(sin(dot(floor(d*60.),vec3(12.9,78.2,37.7)))*43758.5));c+=st*.8;gl_FragColor=vec4(c,1.);}`});
const sky=new T.Mesh(new T.SphereGeometry(300,32,16),skm);sky.renderOrder=-1;sky.frustumCulled=false;sc.add(sky);
const NP=700,pp=new Float32Array(NP*3),pc=new Float32Array(NP*3);for(let i=0;i<NP;i++){pp[i*3]=rnd(-60,60);pp[i*3+1]=rnd(.5,25);pp[i*3+2]=rnd(-60,60);const c=hc(Math.random());pc[i*3]=c.r;pc[i*3+1]=c.g;pc[i*3+2]=c.b}
const sprc=document.createElement('canvas');sprc.width=sprc.height=32;{const g=sprc.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'#fff');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,32,32)}
const pgeo=new T.BufferGeometry();pgeo.setAttribute('position',new T.BufferAttribute(pp,3));pgeo.setAttribute('color',new T.BufferAttribute(pc,3));
const spores=new T.Points(pgeo,new T.PointsMaterial({size:.8,map:new T.CanvasTexture(sprc),vertexColors:true,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));spores.frustumCulled=false;sc.add(spores);
// rainbow arcs
const rg=new T.Group();for(let i=0;i<5;i++){const r=new T.Mesh(new T.TorusGeometry(70+i*7,2.4,8,64,Math.PI),new T.MeshBasicMaterial({color:hc(i/5),fog:false}));r.position.set(0,-4,-150);rg.add(r)}sc.add(rg);
// forest
const deco=[],mats=[];
for(let i=0;i<110;i++){const g=new T.Group(),h=Math.random(),r=rnd(10,95),a=rnd(0,6.283),k=i%3;
 const M=(c,e)=>{const m=new T.MeshLambertMaterial({color:c,emissive:c.clone().multiplyScalar(e||.2),flatShading:true}),o={};c.getHSL(o);mats.push({m,h:o.h,s:o.s,l:o.l,e:e||.2});return m};
 if(k==0){const H=rnd(5,10);const tr=new T.Mesh(new T.CylinderGeometry(.3,.55,H,6),M(hc(h+.1).multiplyScalar(.5),0));tr.position.y=H/2;g.add(tr);
  for(let j=0;j<3;j++){const c=new T.Mesh(new T.ConeGeometry(3-j*.8,3.5,7),M(hc(h+.15*j+.3),.3));c.position.y=H*.6+j*2.2;g.add(c)}}
 else if(k==1){const H=rnd(2,5);const s=new T.Mesh(new T.CylinderGeometry(.35,.5,H,7),M(new T.Color(0xf4e8ff),.2));s.position.y=H/2;g.add(s);
  const cp=new T.Mesh(new T.SphereGeometry(H*.8,12,8,0,6.283,0,1.57),M(hc(h),.35));cp.position.y=H;g.add(cp)}
 else{const H=rnd(3,8);const cr=new T.Mesh(new T.OctahedronGeometry(1,0),M(hc(h+.5),.6));cr.scale.set(1,H/1.5,1);cr.position.y=H/1.5;g.add(cr)}
 g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={p:rnd(0,6),k};deco.push(g);sc.add(g)}
// Stylized first-person weapon, rebuilt from clean geometric parts for each menu selection.
const gun=new T.Group();gun.position.set(.26,-.24,-.55);cam.add(gun);let weaponMotion=0;
function equipped(){return weaponIndex===2?{...KNIVES[knifeIndex],kind:'knife'}:WPN[weaponIndex]}
function buildWeapon(){while(gun.children.length){const o=gun.children.pop();o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose()}
 const w=equipped(),metal=new T.MeshStandardMaterial({color:0x292b38,metalness:.9,roughness:.2}),accent=new T.MeshStandardMaterial({color:w.color,emissive:w.color,emissiveIntensity:.38,metalness:.68,roughness:.2}),grip=new T.MeshStandardMaterial({color:0x171622,roughness:.68});
 const add=(geo,mat,x,y,z,rx=0,ry=0,rz=0)=>{const m=new T.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);gun.add(m);return m};
 const profile=(pts,mat,depth,x=0,y=0,z=0)=>{const s=new T.Shape();s.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))s.lineTo(p[0],p[1]);s.closePath();return add(new T.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.012,bevelThickness:.012}),mat,x,y,z)};
 if(w.kind==='sniper'){
  add(new T.BoxGeometry(.17,.2,.62),metal,0,0,.02);add(new T.BoxGeometry(.13,.16,.38),grip,0,-.17,.23,.2);add(new T.BoxGeometry(.12,.12,.34),grip,0,-.01,.47);
